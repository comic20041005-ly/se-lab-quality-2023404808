name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 可根据你的实际项目 JDK 版本修改，如 '11' 或 '21'
          distribution: 'temurin'
          cache: maven # 自动缓存 Maven 依赖，加速后续构建

      - name: Build and run tests with Maven
        run: mvn clean test